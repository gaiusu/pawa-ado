<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍛冶スコア算定ツール｜カジナイトアカデミー（パワプロアドベンチャーズ）</title>
<style>
:root{
  --ink:#1c1a17;
  --steel-900:#23262b;
  --steel-800:#2c2f35;
  --steel-700:#383c43;
  --steel-600:#4a4f57;
  --steel-500:#858b93;
  --steel-400:#90969e;
  --steel-300:#9aa0a8;
  --steel-200:#c8ccd1;
  --steel-100:#e7e5e0;
  --paper:#f3efe6;
  --ember:#d9763b;
  --ember-deep:#b85c28;
  --gold:#c9a23d;
  --c-red:#c8463a;
  --c-blue:#3576b8;
  --c-yellow:#cf9a2e;
  --c-green:#508a5f;
  --c-gold:#c9a23d;
  --ok:#5a9367;
  --warn:#c8463a;
  --radius:3px;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:var(--sans);
  background:
    radial-gradient(ellipse 1200px 600px at 50% -10%, #34373d 0%, var(--steel-900) 55%),
    var(--steel-900);
  color:var(--steel-100);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 20px 100px;
}

/* ---------- header ---------- */
header.hero{
  padding:56px 0 36px;
  border-bottom:1px solid var(--steel-700);
  margin-bottom:40px;
  position:relative;
}
.eyebrow{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.18em;
  color:var(--ember);
  text-transform:uppercase;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:10px;
}
.eyebrow::before{
  content:"";
  width:18px;height:2px;
  background:var(--ember);
  display:inline-block;
}
h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(28px,4.4vw,44px);
  line-height:1.25;
  margin:0 0 14px;
  letter-spacing:.01em;
}
h1 .sub{
  display:block;
  font-size:.42em;
  color:var(--steel-300);
  font-family:var(--sans);
  font-weight:500;
  letter-spacing:.04em;
  margin-top:8px;
}
.lede{
  max-width:640px;
  color:var(--steel-300);
  font-size:15px;
}
.lede strong{color:var(--steel-100);}

/* ---------- undo banner（反映前に戻す） ---------- */
.undo-banner{
  display:none;
  position:sticky;
  top:0;
  z-index:300;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:var(--steel-700);
  border-bottom:2px solid var(--ember);
  padding:10px 20px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--steel-200);
  flex-wrap:wrap;
}
.undo-btn{
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
  color:var(--ember);
  background:transparent;
  border:1px solid var(--ember);
  border-radius:4px;
  padding:5px 14px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s, color .15s;
}
.undo-btn:hover{background:var(--ember); color:var(--steel-900);}

/* ---------- nav tabs ---------- */
.tabs{
  display:flex;
  gap:4px;
  margin-bottom:32px;
  border-bottom:1px solid var(--steel-700);
}
.tab-btn{
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--steel-300);
  background:none;
  border:none;
  padding:14px 4px;
  margin-right:28px;
  cursor:pointer;
  position:relative;
  transition:color .15s;
}
.tab-btn .num{
  font-family:var(--mono);
  color:var(--steel-600);
  margin-right:8px;
  font-size:12px;
}
.tab-btn.active{color:var(--steel-100);}
.tab-btn.active .num{color:var(--ember);}
.tab-btn::after{
  content:"";
  position:absolute;
  left:0;right:28px;bottom:-1px;
  height:2px;
  background:var(--ember);
  transform:scaleX(0);
  transition:transform .2s ease;
}
.tab-btn.active::after{transform:scaleX(1);}
.tab-btn:hover{color:var(--steel-100);}

.panel{display:none;}
.panel.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto !important;
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* ---------- card ---------- */
.card{
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:var(--radius);
  padding:28px;
  margin-bottom:24px;
}
.card-title{
  font-family:var(--serif);
  font-size:18px;
  font-weight:700;
  margin:0 0 4px;
  display:flex;
  align-items:baseline;
  gap:10px;
}
.card-title .tag{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ember);
  border:1px solid var(--ember-deep);
  border-radius:2px;
  padding:2px 7px;
  letter-spacing:.04em;
}
.card-title-action-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}
.card-title-action-row .card-title{margin-bottom:0;}
.full-sequential-action{
  flex:0 1 360px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:6px;
}
.full-sequential-btn{
  width:100%;
  font-family:var(--sans);
  font-size:13px;
  font-weight:800;
  line-height:1.35;
  color:var(--steel-900);
  background:linear-gradient(135deg, #e2c75c 0%, var(--gold) 55%, #a77d1e 100%);
  border:1px solid #efd879;
  border-radius:var(--radius);
  padding:10px 16px;
  cursor:pointer;
  box-shadow:0 0 0 3px rgba(201,162,61,.14);
  transition:filter .15s, transform .1s;
}
.full-sequential-btn:hover{filter:brightness(1.08);}
.full-sequential-btn:active{transform:translateY(1px);}
.full-sequential-shortcut{
  align-self:center;
  font-family:var(--mono);
  font-size:10px;
  color:var(--steel-400);
  letter-spacing:.03em;
}
.shortcut-key{
  display:inline-block;
  min-width:22px;
  margin-left:3px;
  padding:1px 5px;
  border:1px solid var(--steel-600);
  border-bottom-width:2px;
  border-radius:4px;
  background:var(--steel-900);
  color:var(--steel-200);
  font-family:var(--mono);
  font-size:10px;
  line-height:1.35;
  text-align:center;
}
.card-desc{
  font-size:13px;
  color:var(--steel-300);
  margin:0 0 22px;
}

/* ---------- rank selector ---------- */
.rank-row{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.rank-row label.field-label{margin-bottom:0;}
select#rank-select{width:200px;}

/* ---------- slot grid ---------- */
.slot-stack{
  display:flex;
  flex-direction:column;
  gap:0;
  max-width:460px;
}
.slot-row{
  display:grid;
  grid-template-columns:54px 1fr 78px;
  grid-template-rows:auto auto;
  gap:14px 10px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px dashed var(--steel-700);
  position:relative;
}
.slot-row:last-child{border-bottom:none;}
.recipe-field select{font-size:15px;}
.slot-badge{
  width:40px;height:40px;
  border-radius:50%;
  background:var(--steel-700);
  border:1px solid var(--steel-600);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);
  font-size:13px;
  font-weight:700;
  color:var(--steel-300);
  flex-shrink:0;
}
.slot-row.top .slot-badge{
  background:linear-gradient(135deg, var(--ember) 0%, var(--ember-deep) 100%);
  color:#fff;
  border-color:var(--ember);
  box-shadow:0 0 0 3px rgba(217,118,59,.18);
}
.slot-row.top::before{
  content:"× 2";
  position:absolute;
  right:-2px;
  top:-6px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  color:var(--ember);
  background:var(--steel-800);
  padding:0 4px;
}
.field-mini{display:flex; flex-direction:column; gap:5px;}
.field-mini .ml{
  font-size:11px;
  color:var(--steel-600);
  letter-spacing:.03em;
  font-family:var(--mono);
}
.slot-score{
  font-family:var(--mono);
  font-size:13px;
  color:var(--steel-300);
  text-align:right;
  white-space:nowrap;
}
.slot-score .val{
  font-size:18px;
  font-weight:700;
  color:var(--steel-100);
  display:block;
}

/* ---------- form basics ---------- */
.field-label{
  display:block;
  font-size:12px;
  color:var(--steel-300);
  margin-bottom:6px;
  letter-spacing:.02em;
}
select{
  appearance:none;
  -webkit-appearance:none;
  background:var(--steel-900) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%239aa0a8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 12px center;
  border:1px solid var(--steel-600);
  color:var(--steel-100);
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  padding:10px 32px 10px 12px;
  border-radius:var(--radius);
  width:100%;
  cursor:pointer;
  transition:border-color .15s;
}
select:hover{border-color:var(--ember);}
select:focus{outline:none; border-color:var(--ember); box-shadow:0 0 0 3px rgba(217,118,59,.18);}
select.color-赤{border-left:3px solid var(--c-red);}
select.color-青{border-left:3px solid var(--c-blue);}
select.color-黄{border-left:3px solid var(--c-yellow);}
select.color-緑{border-left:3px solid var(--c-green);}
select.color-金{border-left:3px solid var(--c-gold);}

/* ---------- custom recipe dropdown ---------- */
.visually-hidden{
  position:absolute;
  width:1px; height:1px;
  opacity:0;
  pointer-events:none;
}
.custom-select{
  position:relative;
  width:100%;
}
.custom-select.disabled{
  opacity:.45;
  pointer-events:none;
}
.custom-select-trigger{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  min-width:160px;
  background:var(--steel-900);
  border:1px solid var(--steel-600);
  color:var(--steel-100);
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  padding:11px 14px;
  border-radius:var(--radius);
  cursor:pointer;
  transition:border-color .15s;
  text-align:left;
}
.recipe-field .custom-select-trigger{font-size:15.5px; padding:12px 14px;}
.custom-select-trigger:hover{border-color:var(--ember);}
.custom-select.open .custom-select-trigger{border-color:var(--ember); box-shadow:0 0 0 3px rgba(217,118,59,.18);}
.custom-select-label{flex:1;}
.custom-select-caret{
  font-size:11px;
  color:var(--steel-300);
  transition:transform .15s;
}
.custom-select.open .custom-select-caret{transform:rotate(180deg); color:var(--ember);}

.custom-select-list{
  display:none;
  position:fixed;
  z-index:200;
  margin:0; padding:10px;
  list-style:none;
  background:var(--steel-800);
  border:1px solid var(--steel-600);
  border-radius:var(--radius);
  box-shadow:0 12px 28px rgba(0,0,0,.45);
  width:max-content;
  max-width:min(92vw, 560px);
  max-height:80vh;
  overflow-y:auto;
}
.custom-select.open .custom-select-list{display:grid;}

/* グリッド配置：横列=形（カカシ/指輪/チャーム/腕輪/首飾り）、縦列=色（赤/青/黄/緑/金） */
.custom-option-grid{
  grid-template-columns:auto repeat(5, 1fr);
  gap:4px;
}
.grid-corner{}
.grid-shape-head, .grid-color-head{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  color:var(--steel-300);
  padding:4px 2px;
  white-space:nowrap;
}
.grid-shape-head{writing-mode:horizontal-tb;}
.grid-color-head{justify-content:flex-end; gap:6px; padding-right:6px;}

.custom-option{
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:var(--radius);
  cursor:pointer;
  border:1px solid transparent;
}
.custom-option:hover{background:var(--steel-700);}
.custom-option.selected{background:rgba(217,118,59,.16); border-color:var(--ember);}
.custom-option-label{display:none;}

/* 参考画像の構図だけを手掛かりにした、装飾を抑えた独自のCSS形状アイコン */
.recipe-shape-icon{
  --recipe-icon-color:var(--steel-300);
  position:relative;
  display:inline-block;
  width:26px;
  height:26px;
  flex:0 0 26px;
  color:var(--recipe-icon-color);
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.45));
}
.recipe-color-red{--recipe-icon-color:var(--c-red);}
.recipe-color-blue{--recipe-icon-color:var(--c-blue);}
.recipe-color-yellow{--recipe-icon-color:var(--c-yellow);}
.recipe-color-green{--recipe-icon-color:var(--c-green);}
.recipe-color-gold{
  --recipe-icon-color:var(--c-gold);
  filter:drop-shadow(0 0 3px rgba(244,210,90,.72)) drop-shadow(0 1px 0 rgba(0,0,0,.5));
}
.recipe-shape-icon::before,.recipe-shape-icon::after,.recipe-shape-icon>.recipe-icon-parts::before,.recipe-shape-icon>.recipe-icon-parts::after{
  content:"";
  position:absolute;
  box-sizing:border-box;
}
.recipe-shape-kakashi::before{left:8px; top:9px; width:10px; height:9px; border:2px solid var(--steel-900); border-radius:50%; background:var(--recipe-icon-color);}
.recipe-shape-kakashi::after{left:3px; top:7px; width:20px; height:4px; border:1px solid var(--steel-900); border-radius:50%; background:var(--recipe-icon-color); transform:rotate(-5deg);}
.recipe-shape-kakashi>.recipe-icon-parts::before{left:6px; top:0; width:14px; height:9px; background:var(--recipe-icon-color); clip-path:polygon(50% 0,100% 100%,0 100%);}
.recipe-shape-kakashi>.recipe-icon-parts::after{left:11px; top:16px; width:4px; height:10px; border-radius:2px; background:var(--steel-300); box-shadow:-5px -1px 0 -1px var(--steel-300),5px -1px 0 -1px var(--steel-300);}
.recipe-shape-ring::before{left:4px; top:7px; width:18px; height:17px; border:4px solid var(--recipe-icon-color); border-radius:50%; box-shadow:0 0 0 1px var(--steel-900);}
.recipe-shape-ring::after{left:9px; top:1px; width:8px; height:8px; border:1px solid var(--steel-900); border-radius:2px; background:var(--recipe-icon-color); transform:rotate(45deg);}
.recipe-shape-charm::before{left:7px; top:9px; width:15px; height:16px; border:3px solid var(--recipe-icon-color); border-radius:45% 55% 48% 52%; box-shadow:0 0 0 1px var(--steel-900); transform:rotate(-24deg);}
.recipe-shape-charm::after{left:5px; top:1px; width:10px; height:8px; border:2px solid var(--recipe-icon-color); border-radius:55% 45% 4px 4px; transform:rotate(-30deg);}
.recipe-shape-charm>.recipe-icon-parts::before{left:10px; top:6px; width:3px; height:7px; border-radius:2px; background:var(--recipe-icon-color); transform:rotate(-24deg);}
.recipe-shape-charm>.recipe-icon-parts::after{left:11px; top:14px; width:5px; height:5px; border-radius:50%; background:var(--recipe-icon-color); transform:rotate(-24deg);}
.recipe-shape-bracelet::before{left:3px; top:3px; width:20px; height:20px; border:5px solid var(--recipe-icon-color); border-right-color:transparent; border-radius:50%; box-shadow:0 0 0 1px var(--steel-900) inset; transform:rotate(-24deg);}
.recipe-shape-bracelet::after{right:1px; top:4px; width:5px; height:5px; border:1px solid var(--steel-900); border-radius:50%; background:var(--recipe-icon-color); box-shadow:0 12px 0 var(--recipe-icon-color);}
.recipe-shape-necklace::before{left:2px; top:2px; width:22px; height:17px; border:3px solid var(--recipe-icon-color); border-top:0; border-radius:0 0 50% 50%;}
.recipe-shape-necklace::after{left:9px; top:16px; width:8px; height:8px; border:1px solid var(--steel-900); border-radius:2px; background:var(--recipe-icon-color); transform:rotate(45deg);}
.recipe-icon-sparkles{position:absolute; inset:0; z-index:3; pointer-events:none;}
.recipe-color-gold>.recipe-icon-sparkles::before,.recipe-color-gold>.recipe-icon-sparkles::after{
  content:"";
  position:absolute;
  background:#fff4ad;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  filter:drop-shadow(0 0 2px #fff7c8);
  animation:recipe-gold-sparkle 1.35s ease-in-out infinite;
}
.recipe-color-gold>.recipe-icon-sparkles::before{right:-1px; top:0; width:8px; height:8px;}
.recipe-color-gold>.recipe-icon-sparkles::after{left:0; bottom:1px; width:6px; height:6px; animation-delay:-.68s;}
@keyframes recipe-gold-sparkle{
  0%,34%,100%{opacity:.2; transform:scale(.55) rotate(0deg);}
  55%,72%{opacity:1; transform:scale(1.18) rotate(45deg);}
}
@media (prefers-reduced-motion:reduce){
  .recipe-color-gold>.recipe-icon-sparkles::before,.recipe-color-gold>.recipe-icon-sparkles::after{animation:none; opacity:.9;}
}
.custom-select-trigger .recipe-shape-icon{transform:scale(.82); margin:-3px -2px -3px -3px;}

/* 色見本：赤青黄緑はドット、金はリング状の枠で区別 */
.color-swatch{
  display:inline-block;
  width:13px; height:13px;
  border-radius:50%;
  flex-shrink:0;
}
.swatch-赤{background:var(--c-red);}
.swatch-青{background:var(--c-blue);}
.swatch-黄{background:var(--c-yellow);}
.swatch-緑{background:var(--c-green);}
.swatch-gold-ring{
  background:transparent;
  border:2.5px solid var(--c-gold);
  box-shadow:0 0 0 1.5px var(--steel-900) inset;
}
.custom-option .color-swatch{width:20px; height:20px;}
.custom-option .swatch-gold-ring{border-width:3px;}

/* ---------- collapsible (+ボタンで開く折りたたみ) ---------- */
.collapsible-toggle{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  background:none;
  border:none;
  padding:0;
  margin:0;
  cursor:pointer;
  font-family:var(--sans);
  text-align:left;
}
.collapsible-icon{
  width:22px; height:22px;
  flex-shrink:0;
  border-radius:50%;
  border:1px solid var(--steel-600);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--mono);
  font-size:14px;
  font-weight:700;
  color:var(--steel-300);
  transition:transform .2s, border-color .15s, color .15s;
}
.collapsible-toggle:hover .collapsible-icon{border-color:var(--ember); color:var(--ember);}
.collapsible-toggle.open .collapsible-icon{transform:rotate(45deg); border-color:var(--ember); color:var(--ember);}
.collapsible-body{
  display:none;
  margin-top:18px;
}
.collapsible-body.open{display:block;}

/* ---------- result（内訳カードのヘッダーに統合） ---------- */
.result-toggle{
  flex-wrap:wrap;
}
.result-toggle-main{
  flex:1;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  min-width:0;
}
.result-inline{
  display:flex;
  align-items:baseline;
  gap:12px;
}
.result-label{
  font-family:var(--mono);
  font-size:12px;
  color:var(--steel-300);
  letter-spacing:.06em;
}
.result-num{
  font-family:var(--serif);
  font-size:34px;
  font-weight:700;
  color:var(--ember);
  line-height:1;
}
.result-breakdown{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:18px;
  padding-bottom:18px;
  border-bottom:1px dashed var(--steel-700);
}
.bd-item{
  font-family:var(--mono);
  font-size:12px;
  color:var(--steel-300);

  btn.classList.toggle('open', !isOpen);

/* ============== タブ切り替え ============== */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    document.querySelectorAll('.panel').forEach(p=>{
      p.classList.remove('active');
      p.hidden = true;
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    const panel = document.getElementById('panel-'+btn.dataset.tab);
    panel.hidden = false;
    panel.classList.add('active');
  });
  btn.addEventListener('keydown', (e)=>{
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    const current = tabs.indexOf(btn);
    const delta = e.key === 'ArrowRight' ? 1 : -1;
    const next = tabs[(current + delta + tabs.length) % tabs.length];
    next.focus();
    next.click();
  });
});

/* ============== スコア・ランク・レシピの一括登録ガイド ============== */
const fullSetupOverlay = document.getElementById('full-setup-modal-overlay');
const fullSetupProgressEl = document.getElementById('full-setup-modal-progress');
const fullSetupQuestionEl = document.getElementById('full-setup-modal-question');
const fullSetupBodyEl = document.getElementById('full-setup-modal-body');
const fullSetupBackBtn = document.getElementById('full-setup-back-btn');
const fullSetupOkBtn = document.getElementById('full-setup-ok-btn');
const fullSetupState = {open:false, step:0, currentScore:'', goalScore:0, rank:null, rankAmbiguous:false};
let fullSetupReturnFocus = null;

function parseSetupInteger(value){
  if(String(value).trim() === '') return null;
  const n = Number(value);
  return Number.isInteger(n) && n >= 0 ? n : null;
}

function setupRankLabel(rank){
  if(!rank) return '未選択';
  return `${rank}級（ボーナス +${RANK_BONUS[rank]}）`;
}

// 150点以上は1級・2級の両方があり得る。
// 前回手動で1級を確定している場合だけ1級を引き継ぎ、それ以外は2級を初期値にする。
function preferredAmbiguousRank(){
  return rankSelectEl.value === '1' ? '1' : '2';
}

function setFullSetupError(message){
  const el = document.getElementById('full-setup-error');
  if(el) el.textContent = message || '';
}

function renderFullSetupStep(){
  const step = fullSetupState.step;
  fullSetupProgressEl.textContent = `入力 ${step+1} / 3`;
  fullSetupBackBtn.disabled = step === 0;
  fullSetupBackBtn.style.visibility = step === 0 ? 'hidden' : 'visible';
  fullSetupOkBtn.disabled = false;

  if(step === 0){
    fullSetupQuestionEl.textContent = '現在の鍛冶スコアを入力してください';
    fullSetupBodyEl.innerHTML = `
      <label class="setup-field-label" for="full-setup-current-score">現在の鍛冶スコア</label>
      <input type="number" class="setup-number-input" id="full-setup-current-score" min="0" step="1" inputmode="numeric" value="${fullSetupState.currentScore}">
      <p class="setup-hint">0以上の整数で入力してください。</p>
      <p class="setup-error" id="full-setup-error" aria-live="polite"></p>`;
    requestAnimationFrame(()=>{
      const input = document.getElementById('full-setup-current-score');
      input?.focus();
      input?.select();
    });
    return;
  }

  if(step === 1){
    fullSetupQuestionEl.textContent = '目標到達スコアを確認してください';
    fullSetupBodyEl.innerHTML = `
      <label class="setup-field-label" for="full-setup-goal-score">目標到達スコア</label>
      <div class="setup-number-row">
        <input type="number" class="setup-number-input" id="full-setup-goal-score" min="${fullSetupState.currentScore}" step="1" inputmode="numeric" value="${fullSetupState.goalScore}">
        <button type="button" class="setup-quick-btn" id="full-setup-goal-plus11">+11</button>
      </div>
      <p class="setup-hint">現在スコアから既存ルールに基づく目標を自動提案しています。必要なら変更できます。</p>
      <p class="setup-error" id="full-setup-error" aria-live="polite"></p>`;
    document.getElementById('full-setup-goal-plus11').addEventListener('click', ()=>{
      const input = document.getElementById('full-setup-goal-score');
      const value = parseSetupInteger(input.value);
      input.value = (value == null ? fullSetupState.currentScore : value) + 11;
      input.focus();
    });
    requestAnimationFrame(()=>{
      const input = document.getElementById('full-setup-goal-score');
      input?.focus();
      input?.select();
    });
    return;
  }

  fullSetupQuestionEl.textContent = fullSetupState.rankAmbiguous
    ? '現在の鍛冶ランクは1級と2級のどちらですか？'
    : '現在の鍛冶ランクを確認してください';
  const choiceHtml = fullSetupState.rankAmbiguous ? `
    <p class="setup-rank-question">前回の選択を初期表示しています。現在のランクと異なる場合だけ変更してください。</p>
    <div class="setup-rank-choices">
      <button type="button" class="setup-rank-choice${fullSetupState.rank==='1'?' selected':''}" data-rank="1">1級</button>
      <button type="button" class="setup-rank-choice${fullSetupState.rank==='2'?' selected':''}" data-rank="2">2級</button>
    </div>` : '<p class="setup-rank-question">現在スコアから既存ルールに基づくランクを自動設定しています。</p>';
  fullSetupBodyEl.innerHTML = `
    ${choiceHtml}
    <div class="setup-rank-display" id="full-setup-rank-display" aria-live="polite">${setupRankLabel(fullSetupState.rank)}</div>
    <div class="setup-rank-adjust">
      <button type="button" class="setup-rank-adjust-btn" id="full-setup-rank-up">ランクを上げる</button>
      <button type="button" class="setup-rank-adjust-btn" id="full-setup-rank-down">ランクを下げる</button>
    </div>
    <p class="setup-error" id="full-setup-error" aria-live="polite"></p>`;

  const updateRankControls = ()=>{
    const rankNum = fullSetupState.rank ? Number(fullSetupState.rank) : null;
    const maxRankNum = fullSetupState.rankAmbiguous ? 2 : 4;
    document.getElementById('full-setup-rank-display').textContent = setupRankLabel(fullSetupState.rank);
    document.getElementById('full-setup-rank-up').disabled = rankNum == null || rankNum <= 1;
    document.getElementById('full-setup-rank-down').disabled = rankNum == null || rankNum >= maxRankNum;
    fullSetupOkBtn.disabled = rankNum == null;
    document.querySelectorAll('.setup-rank-choice').forEach(btn=>{
      btn.classList.toggle('selected', btn.dataset.rank === fullSetupState.rank);
    });
  };
  document.querySelectorAll('.setup-rank-choice').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      fullSetupState.rank = btn.dataset.rank;
      setFullSetupError('');
      updateRankControls();
      fullSetupOkBtn.focus();
    });
  });
  document.getElementById('full-setup-rank-up').addEventListener('click', ()=>{
    if(!fullSetupState.rank) return;
    fullSetupState.rank = String(Math.max(1, Number(fullSetupState.rank)-1));
    updateRankControls();
  });
  document.getElementById('full-setup-rank-down').addEventListener('click', ()=>{
    if(!fullSetupState.rank) return;
    const maxRankNum = fullSetupState.rankAmbiguous ? 2 : 4;
    fullSetupState.rank = String(Math.min(maxRankNum, Number(fullSetupState.rank)+1));
    updateRankControls();
  });
  updateRankControls();
  requestAnimationFrame(()=>fullSetupOkBtn.focus());
}

function openFullSetupRegistration(){
  document.querySelectorAll('.custom-select.open').forEach(wrap=>setCustomDropdownOpen(wrap, false));
  fullSetupReturnFocus = document.activeElement;
  const existingCurrent = parseSetupInteger(currentScoreInput.value);
  fullSetupState.open = true;
  fullSetupState.step = 0;
  fullSetupState.currentScore = existingCurrent == null ? '' : existingCurrent;
  fullSetupState.goalScore = existingCurrent == null ? 0 : nearestTripleAbove(existingCurrent);
  fullSetupState.rankAmbiguous = existingCurrent != null && existingCurrent >= 150;
  fullSetupState.rank = fullSetupState.rankAmbiguous ? preferredAmbiguousRank() : (existingCurrent == null ? '4' : autoRankFromScore(existingCurrent));
  fullSetupOverlay.setAttribute('aria-hidden', 'false');
  fullSetupOverlay.classList.add('open');
  renderFullSetupStep();
}

function closeFullSetupRegistration(restoreFocus=true){
  fullSetupState.open = false;
  fullSetupOverlay.classList.remove('open');
  fullSetupOverlay.setAttribute('aria-hidden', 'true');
  if(restoreFocus && fullSetupReturnFocus && typeof fullSetupReturnFocus.focus === 'function') fullSetupReturnFocus.focus();
  fullSetupReturnFocus = null;
}

function confirmFullSetupStep(){
  if(fullSetupState.step === 0){
    const value = parseSetupInteger(document.getElementById('full-setup-current-score').value);
    if(value == null){ setFullSetupError('現在の鍛冶スコアを0以上の整数で入力してください。'); return; }
    fullSetupState.currentScore = value;
    fullSetupState.goalScore = nearestTripleAbove(value);
    fullSetupState.rankAmbiguous = value >= 150;
    fullSetupState.rank = fullSetupState.rankAmbiguous ? preferredAmbiguousRank() : autoRankFromScore(value);
    fullSetupState.step = 1;
    renderFullSetupStep();
    return;
  }

  if(fullSetupState.step === 1){
    const value = parseSetupInteger(document.getElementById('full-setup-goal-score').value);
    if(value == null){ setFullSetupError('目標到達スコアを0以上の整数で入力してください。'); return; }
    if(value < fullSetupState.currentScore){ setFullSetupError('目標到達スコアは現在の鍛冶スコア以上にしてください。'); return; }
    fullSetupState.goalScore = value;
    fullSetupState.step = 2;
    renderFullSetupStep();
    return;
  }

  if(!fullSetupState.rank){ setFullSetupError('現在の鍛冶ランクを選択してください。'); return; }
  currentScoreInput.value = fullSetupState.currentScore;
  goalScoreInput.value = fullSetupState.goalScore;
  rankSelectEl.value = fullSetupState.rank;
  rankSelectEl.dispatchEvent(new Event('change', {bubbles:true}));
  updateDiff();
  clearSolverResultsOnHandChange();
  const returnFocus = fullSetupReturnFocus;
  closeFullSetupRegistration(false);
  if(returnFocus && typeof returnFocus.focus === 'function') returnFocus.focus();
  openSequentialRegistration();
}

document.getElementById('full-sequential-register-btn').addEventListener('click', openFullSetupRegistration);
document.getElementById('full-setup-modal-close').addEventListener('click', ()=>closeFullSetupRegistration(true));
fullSetupOverlay.addEventListener('click', (e)=>{
  if(e.target === fullSetupOverlay) closeFullSetupRegistration(true);
});
fullSetupBackBtn.addEventListener('click', ()=>{
  if(fullSetupState.step <= 0) return;
  fullSetupState.step -= 1;
  renderFullSetupStep();
});
fullSetupOkBtn.addEventListener('click', confirmFullSetupStep);
fullSetupOverlay.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    e.preventDefault();
    closeFullSetupRegistration(true);
  } else if(e.key === 'Enter' && !e.target.closest('.setup-rank-choice, .setup-rank-adjust-btn, #full-setup-goal-plus11')){
    e.preventDefault();
    confirmFullSetupStep();
  }
});

// ページ内の位置に関係なく、Sキーで一括登録を開始する。
// モーダル表示中・修飾キー使用中・IME変換中・キー長押し中は誤起動を防ぐ。
document.addEventListener('keydown', (e)=>{
  if(e.key.toLowerCase() !== 's' || e.ctrlKey || e.metaKey || e.altKey || e.isComposing || e.repeat) return;
  if(fullSetupState.open || sequentialState.open) return;
  e.preventDefault();
  openFullSetupRegistration();
});

/* ============== 連続で登録：アクティブ1〜3枠→ストック1〜6枠を順番に質問形式で設定する ============== */
const SEQUENTIAL_STEPS = [
  {type:'active', idx:0, label:'アクティブスロット1枠目'},
  {type:'active', idx:1, label:'アクティブスロット2枠目'},
  {type:'active', idx:2, label:'アクティブスロット3枠目'},
  {type:'stock',  idx:0, label:'ストックスロット1枠目'},
  {type:'stock',  idx:1, label:'ストックスロット2枠目'},
  {type:'stock',  idx:2, label:'ストックスロット3枠目'},
  {type:'stock',  idx:3, label:'ストックスロット4枠目'},
  {type:'stock',  idx:4, label:'ストックスロット5枠目'},
  {type:'stock',  idx:5, label:'ストックスロット6枠目'},
];
const SEQUENTIAL_STOCK_EMPTY_LABEL = "空き(選択を終了する)";

const sequentialState = { open:false, stepIndex:0 };
const sequentialOverlay = document.getElementById('sequential-modal-overlay');
const sequentialProgressEl = document.getElementById('sequential-modal-progress');
const sequentialQuestionEl = document.getElementById('sequential-modal-question');
const sequentialGridEl = document.getElementById('sequential-modal-grid');
let sequentialReturnFocus = null;

function currentSequentialStep(){
  return SEQUENTIAL_STEPS[sequentialState.stepIndex];
}

function renderSequentialStep(){
  const step = currentSequentialStep();
  if(!step){ closeSequentialRegistration(true); return; }

  const selClass = step.type === 'active' ? 'active-recipe' : 'stock-recipe';
  const hiddenSelect = document.querySelector(`.${selClass}[data-idx="${step.idx}"]`);
  const emptyLabel = step.type === 'active' ? UNSELECTED_ACTIVE_KEY : SEQUENTIAL_STOCK_EMPTY_LABEL;
  // 実際の<select>の空き値（ストックは「空き」）と、モーダル表示用の空きラベル
  // （ストックは「空き(選択を終了する)」）が異なるため、ハイライト判定用に正規化する
  const realEmptyKey = step.type === 'active' ? UNSELECTED_ACTIVE_KEY : DEFAULT_STOCK_KEY;
  const currentKey = hiddenSelect.value === realEmptyKey ? emptyLabel : hiddenSelect.value;

  sequentialProgressEl.textContent = `${sequentialState.stepIndex + 1} / ${SEQUENTIAL_STEPS.length}`;
  sequentialQuestionEl.textContent = `${step.label}を何にしますか？`;
  sequentialGridEl.innerHTML = recipeGridCellsHTML(currentKey, true, emptyLabel);
  requestAnimationFrame(()=>{
    const selected = sequentialGridEl.querySelector('.custom-option.selected');
    (selected || sequentialGridEl.querySelector('.custom-option'))?.focus();
  });
}

function openSequentialRegistration(){
  sequentialReturnFocus = document.activeElement;
  sequentialState.open = true;
  sequentialState.stepIndex = 0;
  sequentialOverlay.setAttribute('aria-hidden', 'false');
  sequentialOverlay.classList.add('open');
  renderSequentialStep();
}

function closeSequentialRegistration(completed){
  sequentialState.open = false;
  sequentialOverlay.classList.remove('open');
  sequentialOverlay.setAttribute('aria-hidden', 'true');
  // 全枠回答し終えた／ストックで「空き(選択を終了する)」を選んで終了した場合のみ、
  // 続けて使うであろう「手持ちレシピでスコアを探す」欄までスクロールする
  // （×ボタンや背景クリックでの途中キャンセル時はスクロールしない）
  if(completed){
    document.getElementById('solver-card').scrollIntoView({behavior:'smooth', block:'start'});
    document.getElementById('target-search-btn').focus();
  } else if(sequentialReturnFocus && typeof sequentialReturnFocus.focus === 'function'){
    sequentialReturnFocus.focus();
  }
  sequentialReturnFocus = null;
}

function advanceSequentialRegistration(){
  sequentialState.stepIndex += 1;
  if(sequentialState.stepIndex >= SEQUENTIAL_STEPS.length){
    closeSequentialRegistration(true);
  } else {
    renderSequentialStep();
  }
}

document.getElementById('sequential-register-btn-diff').addEventListener('click', openSequentialRegistration);
document.getElementById('sequential-modal-close').addEventListener('click', ()=> closeSequentialRegistration(false));
sequentialOverlay.addEventListener('click', (e)=>{
  if(e.target === sequentialOverlay) closeSequentialRegistration(false);
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && sequentialState.open){
    e.preventDefault();
    closeSequentialRegistration(false);
  }
});

sequentialGridEl.addEventListener('click', (e)=>{
  const optionEl = e.target.closest('.custom-option');
  if(!optionEl) return;
  // このグリッドは通常の.custom-select構造の外にあるため、通常のドロップダウン用
  // グローバルクリックハンドラ（initCustomDropdowns）に処理させないよう伝播を止める
  e.stopPropagation();

  const step = currentSequentialStep();
  if(!step) return;

  const selClass = step.type === 'active' ? 'active-recipe' : 'stock-recipe';
  const hiddenSelect = document.querySelector(`.${selClass}[data-idx="${step.idx}"]`);
  const isEmpty = optionEl.dataset.empty === "true";
  // モーダル内の表示ラベル（アクティブ:「未選択です」／ストック:「空き(選択を終了する)」）は
  // ガイド用の見た目に過ぎず、実際の<select>に登録されている空き選択肢の値とは異なるため、
  // 実際に格納すべきキー（アクティブ:UNSELECTED_ACTIVE_KEY／ストック:DEFAULT_STOCK_KEY="空き"）に変換する。
  const realEmptyKey = step.type === 'active' ? UNSELECTED_ACTIVE_KEY : DEFAULT_STOCK_KEY;
  hiddenSelect.value = isEmpty ? realEmptyKey : optionEl.dataset.key;
  hiddenSelect.dispatchEvent(new Event('change', {bubbles:true}));

  // ストック枠で「空き(選択を終了する)」を選んだ瞬間、以降のストック枠はスキップして終了する
  // （ストックは前詰めで埋まる仕様のため、途中が空きならそれ以降も必ず空きになる。
  //   まだ質問していない後続のストック枠に古い値が残っていた場合も、矛盾しないよう空きに揃える）
  if(step.type === 'stock' && isEmpty){
    clearRemainingStockSlots(step.idx);
    closeSequentialRegistration(true);
    return;
  }

  advanceSequentialRegistration();
});

// fromIdx（0始まり）より後ろの、まだ連続登録で聞いていないストック枠を「空き」に揃える
function clearRemainingStockSlots(fromIdx){
  for(let i = fromIdx + 1; i < 6; i++){
    const sel = document.querySelector(`.stock-recipe[data-idx="${i}"]`);
    if(sel.value !== DEFAULT_STOCK_KEY){
      sel.value = DEFAULT_STOCK_KEY;
      sel.dispatchEvent(new Event('change', {bubbles:true}));
    }
  }
}
